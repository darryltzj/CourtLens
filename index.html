<head>

<title>CourtLens</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceeea;--card:#fafaf8;--ink:#17202b;--muted:#5d6670;--line:#d6dad3;--accent:#e35a12;--paint:#fbe9dc;--good:#1e7a46;--goodbg:#dcefe2;--bad:#b4232c;--badbg:#f8e0e0;--flatbg:#e6e9e4;--head:#1a2b45;--headsoft:#b7c2d3;--cond:'Barlow Condensed','Arial Narrow',sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--head);color:#fff;padding:0 20px;display:flex;align-items:stretch;gap:28px;flex-wrap:wrap;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--accent)}
header h1{font-family:var(--cond);font-style:italic;font-weight:800;font-size:27px;margin:0;padding:9px 0 7px;letter-spacing:.005em;line-height:1}
nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav a{font-family:var(--cond);font-size:18px;font-weight:600;color:var(--headsoft);text-decoration:none;padding:12px 12px 9px;cursor:pointer;position:relative;white-space:nowrap}
nav a:hover{color:#fff}
nav a.on{color:#fff}
nav a.on::after{content:'';position:absolute;left:8px;right:8px;bottom:-3px;height:6px;background:var(--accent);border-radius:3px 3px 0 0}
.asof{margin-left:auto;align-self:center;font-size:13px;color:var(--headsoft)}
@media(max-width:700px){header{gap:0 16px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}header h1{font-size:24px}nav{order:3;width:calc(100% + 32px);margin:0 -16px;padding:0 6px;justify-content:space-between}nav a{font-size:16.5px;padding:10px 6px 9px}nav a.on::after{left:4px;right:4px}.asof{margin-left:0;font-size:12px;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{padding:16px max(12px,env(safe-area-inset-right)) 40px max(12px,env(safe-area-inset-left))}h2{font-size:28px}.card{padding:12px}}
main .show-sm{display:none}
main{max-width:1200px;margin:0 auto;padding:24px 20px 48px}
h2{font-family:var(--cond);font-size:36px;font-weight:700;line-height:1.05;margin:4px 0 6px}
h3{font-family:var(--cond);font-size:20px;font-weight:600;margin:0 0 10px;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 20px;max-width:72ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px;overflow-x:auto}
.grid2>*,.mh>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px 20px;margin-bottom:20px}
.kpi{border-top:2px solid var(--ink);padding:8px 0 4px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--cond);font-size:32px;font-weight:700;line-height:1.05;margin-top:2px}
.kpi .s{font-size:13px;color:var(--muted)}
.card .kpi,.row>.kpi{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--ink);border-radius:0 0 6px 6px;padding:8px 12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-family:var(--cond);font-size:15px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tr.avg td{background:var(--flatbg);font-weight:700}
tr.click{cursor:pointer}
tr.click:hover td{background:#f1f2ee}
tr.sel td{background:var(--paint)!important}
.num{font-size:14px}
.chip{display:inline-block;padding:1px 6px;border-radius:3px;font-size:12px;font-weight:600}
.up{background:var(--goodbg);color:var(--good)}
.down{background:var(--badbg);color:var(--bad)}
.flat{background:var(--flatbg);color:#4a535c}
.tabbr{display:inline-block;min-width:38px;font-family:var(--cond);font-size:16px;font-weight:700;color:var(--accent)}
.link{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:#a9b0a6;text-underline-offset:3px}
.link:hover{color:var(--accent);text-decoration-color:currentColor}
.back{color:var(--muted);cursor:pointer;font-weight:600;display:inline-block;margin-bottom:6px}
.back:hover{color:var(--accent)}
.verdict{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:4px;font-weight:600}
.bar{position:relative;height:10px;background:var(--flatbg);border-radius:5px;width:200px;max-width:100%}
.bar .g{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar .a{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
input[type=search],input[type=number],select{font:inherit;border:1px solid #c3c8c0;border-radius:4px;padding:8px 10px;background:#fff;color:var(--ink)}
input[type=search]{width:100%}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--paint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.date{font-family:var(--cond);font-size:20px;font-weight:600;color:var(--ink);margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.gm{display:grid;grid-template-columns:1fr 1.5rem 1fr minmax(9rem,14rem);gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;margin-bottom:6px}
.gm:hover{border-color:var(--accent)}
.gm .tm{font-family:var(--cond);font-size:21px;font-weight:700;line-height:1.1}
.gm .tm small{display:block;font-family:Barlow,sans-serif;font-weight:500;color:var(--muted);font-size:13px}
.gm .at{color:var(--muted);font-weight:600}
.gm .time{font-size:13px;color:var(--muted);text-align:right}
@media(max-width:560px){.gm{grid-template-columns:1fr auto 1fr}.gm .time{grid-column:1/-1;text-align:left}}
.mh{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.mh .side{text-align:center}
.mh .nm{font-family:var(--cond);font-size:26px;font-weight:700}
.mh .rec{color:var(--muted)}
.vsbox{text-align:center;color:var(--muted);font-family:var(--cond);font-size:22px;font-weight:600}
.card.board{background:var(--head);border-color:var(--head);color:#fff;padding:22px 18px 16px}
.board .nm .link{color:#fff;text-decoration-color:#4c5f7d}
.board .rec,.board .vsbox,.board .note{color:var(--headsoft)}
.board .score{font-family:var(--cond);font-size:68px;font-weight:700;line-height:.95;margin:2px 0 6px}
.board .lead .score{color:var(--accent)}
@media(max-width:560px){.board .score{font-size:50px}.mh .nm{font-size:22px}}
.pill{font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:4px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.calc{border:2px solid var(--ink)}
svg text{font-family:Barlow,sans-serif}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.note{font-size:13px;color:var(--muted)}
.empty{padding:14px;color:var(--muted);background:var(--flatbg);border-radius:4px}
.cmpbar{display:grid;grid-template-columns:70px 1fr 90px 1fr 70px;gap:8px;align-items:center;margin:8px 0}
.cmpbar .lab{text-align:center;font-family:var(--cond);font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase}
.cmpbar .v{font-family:var(--cond);font-size:18px;font-weight:700}
.hb{height:10px;border-radius:5px;background:var(--flatbg);position:relative;overflow:hidden}
.hb i{position:absolute;top:0;bottom:0;border-radius:5px}
.hb.l i{right:0}
.hb.r i{left:0}
.scrollrow{position:relative}
#pjdet,#calccard{scroll-margin-top:110px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:rgba(227,90,18,.15)}
@media(hover:none){tr.click:hover td{background:inherit}.gm:hover{border-color:var(--line)}}
/* ---- phones ---- */
@media(max-width:700px){
 body{font-size:14.5px}
 input[type=search],input[type=number],select,#c_pl{font-size:16px!important} /* stops iOS zoom-on-focus */
 th,td{padding:6px 6px}
 th{font-size:14px}
 .num{font-size:13.5px}
 .hide-sm{display:none}
 .show-sm{display:block!important}
 /* keep the name column visible while a wide table scrolls sideways */
 .tw table td:first-child,.tw table th:first-child,.card table td:first-child,.card table th:first-child{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--line);white-space:normal;min-width:96px;max-width:44vw}
 tr.avg td:first-child{background:var(--flatbg)}
 tr.click:active td{background:#f1f2ee}
 .scrollrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px;-webkit-overflow-scrolling:touch}
 .scrollrow::-webkit-scrollbar{display:none}
 .scrollrow>*{flex:0 0 auto}
 .pill{padding:8px 12px;font-size:14px}
 .calcf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .calcf label{min-width:0!important}
 .calcf label:first-child{grid-column:1/-1}
 .calcf input,.calcf select{width:100%!important}
 .kpis{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:4px 14px}
 .kpi .v{font-size:28px}
 .cmpbar{grid-template-columns:48px 1fr 64px 1fr 48px;gap:6px}
 .cmpbar .lab{font-size:12.5px}
 .bar{width:110px}
 .row>.kpi{min-width:0!important;flex:1 1 40%!important}
 .board .vsbox .note{font-size:11px;max-width:6.5rem;margin:4px auto 0}
 .mh{gap:8px}
 .vsbox{font-size:18px}
 .legend{font-size:12.5px;gap:8px 12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ===== parse ===== */
const T={},PL=[];let TGAMES=[];
(function parse(){
  const lines=$('#raw').textContent.trim().split('\n');
  const prow=s=>{const f=s.split(',');const r={d:f[0],tm:f[1],opp:f[2],home:f[3][0]==='1',wl:f[3].slice(1)};K.forEach((k,i)=>r[k]=+f[4+i]);r.gs=gmsc(r);return r};
  lines.forEach(l=>{
    const p=l.split('|');

    else if(p[0]==='T'){TGAMES=p[1].split(';').map(s=>{const f=s.split(',');return{d:f[0],t:f[1],o:f[2],h:f[3]==='1',wl:f[4],pts:+f[5],opp:+f[6],poss:+f[7]}})}
    else if(p[0]==='P'){

      const log=p[5]?p[5].split(';').map(prow):[],vs={};(p[6]||'').split('~').filter(Boolean).forEach(x=>{const k=x.indexOf(':');vs[x.slice(0,k)]=x.slice(k+1)?x.slice(k+1).split(';').map(prow):[]});
      PL.push({id:PL.length,name:p[1],team:p[2],gp,tot,avg,gsAvg:gmsc(avg),log,l10:log.slice(0,10),vs});
    }
  });
  Object.keys(TEAMS).forEach(a=>{
    const g=TGAMES.filter(x=>x.t===a).sort((x,y)=>x.d<y.d?-1:1);
    const w=g.filter(x=>x.wl==='W').length;const l5=g.slice(-5),p5=l5.reduce((s,x)=>s+x.poss,0);
    const R0=RTG[a]||[110,110];T[a]={abbr:a,games:g,w,l:g.length-w,ortg:R0[0],drtg:R0[1],net:R0[0]-R0[1],pace:g.reduce((s,x)=>s+x.poss,0)/g.length,
      ppg:g.reduce((s,x)=>s+x.pts,0)/g.length,oppg:g.reduce((s,x)=>s+x.opp,0)/g.length,
      l5o:100*l5.reduce((s,x)=>s+x.pts,0)/p5,l5d:100*l5.reduce((s,x)=>s+x.opp,0)/p5};
    T[a].l5net=T[a].l5o-T[a].l5d;
  });
  const TL=Object.values(T);
  [...TL].sort((a,b)=>b.ortg-a.ortg).forEach((t,i)=>t.ork=i+1);
  [...TL].sort((a,b)=>a.drtg-b.drtg).forEach((t,i)=>t.drk=i+1);
  [...TL].sort((a,b)=>b.net-a.net).forEach((t,i)=>t.nrk=i+1);
  PL.forEach(p=>{
    if(p.l10.length>1){const m=p.l10.reduce((s,r)=>s+r.gs,0)/p.l10.length;p.gsSd=Math.max(2.5,Math.sqrt(p.l10.reduce((s,r)=>s+(r.gs-m)**2,0)/(p.l10.length-1)))}else p.gsSd=4;
    p.nextGame=SCHED.find(g=>(g.a===p.team||g.h===p.team)&&g.t>NOW);
  });
})();
var NOW=new Date();
PL.forEach(p=>p.nextGame=SCHED.find(g=>(g.a===p.team||g.h===p.team)&&g.t>NOW-3*3600e3));
const LG=(()=>{const TL=Object.values(T);return{o:TL.reduce((s,t)=>s+t.ortg,0)/30,d:TL.reduce((s,t)=>s+t.drtg,0)/30}})();
const nextFor=a=>SCHED.find(g=>(g.a===a||g.h===a)&&g.t>NOW-3*3600e3);


/* ===== injuries (Nov 15 2026) ===== */
const normN=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b\.?/g,'').replace(/[^a-z]/g,'');
const ABBR_FULL=Object.fromEntries(Object.entries(TEAMS).map(([a,v])=>[v.join(' '),a]));
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const INJ=$('#inj').textContent.trim().split('\n').map(l=>{const[tf,name,pos,ret,st]=l.split('|');const t=ABBR_FULL[tf];const[d,m]=ret.split(' ');const mi=MON[m];const retD=new Date(Date.UTC(mi>=9?2026:2027,mi,+d));
  const p=PL.find(x=>x.team===t&&normN(x.name)===normN(name))||PL.find(x=>normN(x.name)===normN(name));return{t,name,pos,ret,retD,st,p}}).filter(x=>x.t);
const INJP={};INJ.forEach(i=>{if(i.p)INJP[i.p.id]=i});

const etDay=d=>new Date(d.toLocaleDateString('en-CA',{timeZone:'America/New_York'})+'T00:00:00Z');
function stOf(p,g){const i=INJP[p.id];if(!i)return null;const gd=etDay(g.t);
  if(i.st==='Out')return gd<i.retD?'out':+gd===+i.retD?'q':null;
  const nx=nextFor(p.team);return nx&&nx.id===g.id?'q':null}
function injFor(t,g){return INJ.filter(i=>i.t===t&&(g?(i.p?stOf(i.p,g):(i.st==='Out'&&etDay(g.t)<i.retD?'out':null)):true))}
function onOff(p){const tg=T[p.team].games,dates=new Set(p.log.filter(r=>r.tm===p.team).map(r=>r.d.slice(2)));
  const agg=G=>{const ps=G.reduce((s,x)=>s+x.poss,0);return G.length?{n:G.length,w:G.filter(x=>x.wl==='W').length,o:100*G.reduce((s,x)=>s+x.pts,0)/ps,d:100*G.reduce((s,x)=>s+x.opp,0)/ps}:null};
  return{on:agg(tg.filter(x=>dates.has(x.d))),off:agg(tg.filter(x=>!dates.has(x.d)))}}
function teamAdj(t,g){
  const outs=PL.filter(p=>p.team===t&&stOf(p,g)==='out');const Tm=T[t];let o=0,d=0;
  outs.forEach(p=>{const share=Math.min(1,p.log.filter(r=>r.tm===t).length/Math.max(1,Tm.games.length));
    o-=0.3*(p.avg.pts+0.6*p.avg.ast)*100/Tm.pace*share;d+=0.15*(p.avg.stl+p.avg.blk+0.2*p.avg.reb)*100/Tm.pace*share});
  return{outs,o,d,stars:outs.filter(isStar)};
}
function boostFor(p,g,k){
  const adj=teamAdj(p.team,g);if(!adj.outs.length)return 1;
  const v=x=>sv(x.avg,k);
  const Tm=T[p.team],lost=adj.outs.reduce((s,x)=>s+v(x)*Math.min(1,x.log.filter(r=>r.tm===p.team).length/Math.max(1,Tm.games.length)),0);
  const pool=PL.filter(x=>x.team===p.team&&x.avg.min>=10&&active(x)&&stOf(x,g)!=='out').reduce((s,x)=>s+v(x),0);
  return pool>0?Math.min(1.35,1+0.7*lost/pool):1;
}
const stBadge=s=>s==='out'?'<span class="chip down">OUT</span>':s==='q'?'<span class="chip" style="background:#fef3c7;color:#92400e">Q</span>':'';
function impactCard(t,g){
  const adj=g?teamAdj(t,g):{stars:INJ.filter(i=>i.t===t&&i.st==='Out'&&isStar(i.p)).map(i=>i.p)};
  if(g&&!adj.outs.length)return'';
  const stars=g?adj.stars:adj.stars;
  const A=g?adj:(()=>{const fake={t:new Date(Date.now()+864e5)};return teamAdj(t,SCHED.find(x=>(x.a===t||x.h===t)&&x.t>NOW-3*3600e3)||fake)})();
  const Tm=T[t];
  const mates=PL.filter(x=>x.team===t&&x.avg.min>=12&&active(x)&&!A.outs.includes(x)).map(x=>{const gg=g||SCHED.find(z=>(z.a===t||z.h===t)&&z.t>NOW-3*3600e3);return{x,b:gg?boostFor(x,gg,'pts'):1}}).sort((a,b)=>b.x.avg.pts*(b.b-1)-a.x.avg.pts*(a.b-1)).slice(0,4);
  return`<div class="card"><h3>${esc(full(t))} · impact of absences${g?' for this game':''}</h3>
   ${A.outs.length?`<p style="margin:0 0 10px">Out: ${A.outs.map(p=>`${plink(p)}${isStar(p)?' <span class="chip" style="background:#fde68a;color:#92400e">★ star</span>':''} <span class="note">${f1(p.avg.pts)}/${f1(p.avg.reb)}/${f1(p.avg.ast)}</span>`).join(' · ')}</p>`:''}
   <div class="kpis" style="margin-bottom:10px">
    <div class="kpi"><div class="l">Off rtg</div><div class="v" style="font-size:18px">${f1(Tm.ortg+A.o)}</div><div class="s">${dchip(A.o,true,0.2)} from ${f1(Tm.ortg)}</div></div>

  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user){PK.state='none';rerenderPicks();return}
  const uid=await user.id();if(!uid){PK.state='none';rerenderPicks();return}
  /* each signed-in viewer has a private pick list: data/users/<their id>/cl/picks (nobody else, not even the owner, can read it) */
  PK.db=db;PK.col=db.collection('data/users/'+uid+'/cl/picks');
  const to=setTimeout(()=>{if(PK.state==='loading'){PK.state='error';PK.err='Your picks took too long to load. Try reopening the app.';rerenderPicks()}},10000);
  PK.col.onSnapshot(s=>{clearTimeout(to);PK.list=s.docs.map(d=>Object.assign({},d.data(),{_id:d.id}));PK.state='ready';rerenderPicks()},
    e=>{clearTimeout(to);PK.state='error';PK.err=(e&&(e.message||e.code))||'Could not load picks.';rerenderPicks()});
}catch(e){PK.state='none';rerenderPicks()}})();

function pickProb(g,o){ // model chance at the time of the pick (0..1) or null
  try{
    if(o.kind==='prop'){const p=PL[o.pid];if(!p||stOf(p,g)==='out')return null;const pr=pproj(p,g,o.stat),po=pFinal(p,pr,o.stat,o.line);return o.side==='over'?po:1-po}
    const gp=gameProj(g);
    if(o.kind==='ml')return o.team===g.h?gp.ph:gp.pa;
    if(o.kind==='spread'){const m=o.team===g.h?gp.margin:-gp.margin;return Phi((m+o.line)/12.5)}
    if(o.kind==='total'){const po=1-Phi((o.line-gp.total)/17);return o.side==='over'?po:1-po}
  }catch(e){}return null;
}
function pickText(k){
  const S=PSTATS[k.stat];
  return k.kind==='prop'?`<b>${esc(k.player)}</b> ${k.side==='over'?'Over':'Under'} ${k.line} ${S?S.l.toLowerCase():esc(k.stat)}`
    :k.kind==='ml'?`<b>${esc(nick(k.team))}</b> to win`
    :k.kind==='spread'?`<b>${esc(nick(k.team))}</b> ${k.line>0?'+':''}${k.line}`
    :`${k.side==='over'?'Over':'Under'} ${k.line} total points`;
}
function grade(k){ // hit / miss / push / void / pending, graded from the box scores in this build
  const y=k.etd,tgOf=t=>TGAMES.find(x=>x.t===t&&x.d===md4(y));
  if(k.kind==='prop'){
    const tg=tgOf(k.team);let r=null;
    for(const p of PL.filter(p=>p.name===k.player)){r=p.log.find(x=>x.d===ymd6(y));if(r)break}
    if(!r)return tg?{res:'void',act:'Did not play'}:{res:'pending',act:''};
    const v=sv(r,k.stat);return{res:v===k.line?'push':(k.side==='over')===(v>k.line)?'hit':'miss',act:`${v} ${PSTATS[k.stat]?PSTATS[k.stat].l.toLowerCase():''}`};
  }
  const tg=tgOf(k.kind==='total'?k.h:k.team);if(!tg)return{res:'pending',act:''};
  const sc=`${tg.pts}–${tg.opp}`;
  if(k.kind==='ml')return{res:tg.wl==='W'?'hit':'miss',act:`${nick(k.team)} ${tg.wl==='W'?'won':'lost'} ${sc}`};
  if(k.kind==='spread'){const m=tg.pts-tg.opp+k.line;return{res:m===0?'push':m>0?'hit':'miss',act:`${nick(k.team)} ${tg.wl==='W'?'won':'lost'} ${sc}`}}
  const t=tg.pts+tg.opp;return{res:t===k.line?'push':(k.side==='over')===(t>k.line)?'hit':'miss',act:`Total ${t} (${sc})`};
}
const RES={hit:['Hit','up'],miss:['Miss','down'],push:['Push','flat'],void:['Void','flat'],pending:['Pending','flat']};
const tally=L=>{const h=L.filter(x=>x.g.res==='hit').length,m=L.filter(x=>x.g.res==='miss').length,pe=L.filter(x=>x.g.res==='pending').length;return{h,m,pe,n:L.length,rate:h+m?h/(h+m):NaN}};
const rateTxt=t=>t.h+t.m?`${Math.round(t.rate*100)}%`:'—';
/* ----- groups (parlays): pick.grp = "YYYY-MM-DD#n" (local day the group was started + number) ----- */
const grpDay=id=>String(id).split('#')[0], grpNum=id=>+String(id).split('#')[1];
function groupsOf(list){const G={};list.forEach(k=>{if(k.grp)(G[k.grp]=G[k.grp]||[]).push(k)});return G}
function gradeGroup(legs){const r=legs.map(k=>(k.g||grade(k)).res);if(r.includes('miss'))return'lost';if(r.includes('pending'))return'pending';return r.includes('hit')?'won':'void'}
const GRES={won:['Won','up'],lost:['Lost','down'],pending:['Pending','flat'],void:['Void','flat']};
const gTally=arr=>{const w=arr.filter(x=>x==='won').length,l=arr.filter(x=>x==='lost').length,p=arr.filter(x=>x==='pending').length;return{w,l,p,n:arr.length,rate:w+l?w/(w+l):NaN}};
const gRateTxt=t=>t.w+t.l?`${Math.round(t.rate*100)}%`:'—';
function saveGrpName(id){const inp=$('#grpname');if(!inp||!PK.db)return;const v=inp.value.trim().slice(0,40)||null;const legs=groupsOf(PK.list)[id]||[];PK.ren=null;
  Promise.all(legs.map(k=>PK.col.doc(k._id).update({gname:v}))).then(()=>{PK.note=''}).catch(err=>{PK.note='Could not rename: '+((err&&(err.message||err.code))||'error')}).finally(()=>rerenderPicks())}
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='grpname'){if(e.key==='Enter'){e.preventDefault();saveGrpName(e.target.dataset.grpid)}else if(e.key==='Escape'){PK.ren=null;rerenderPicks()}}});
function grpName(id,legs){const n=(legs||groupsOf(PK.list)[id]||[]).map(k=>k.gname).find(Boolean);return n?String(n):`Group ${grpNum(id)}`}
function nextGrpNum(day){const n=Object.keys(groupsOf(PK.list)).filter(id=>grpDay(id)===day).map(grpNum);return n.length?Math.max(...n)+1:1}
function grpSel(g){ // "add to group" picker shown next to Add pick
  const day=ymdLocal(g.t),G=groupsOf(PK.list),dl=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const ids=Object.keys(G).filter(id=>grpDay(id)===day||G[id].some(k=>grade(k).res==='pending')).sort((a,b)=>grpDay(a)<grpDay(b)?-1:grpDay(a)>grpDay(b)?1:grpNum(a)-grpNum(b));
  if(PK.grp&&PK.grp!=='new'&&!ids.includes(PK.grp))PK.grp='';
  const opts=[['','No group']].concat(ids.map(id=>[id,`${grpName(id,G[id])}${grpDay(id)!==day?' · '+dl(grpDay(id)):''} (${G[id].length} pick${G[id].length>1?'s':''})`]),[['new',`+ New group (Group ${nextGrpNum(day)})`]]);
  return`<label><div class="note">Group</div><select data-grpsel data-gid="${esc(g.id)}" style="font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff">${opts.map(([v,t])=>`<option value="${esc(v)}" ${v===PK.grp?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
}
function refreshGrpSels(){document.querySelectorAll('[data-grpsel]').forEach(el=>{const g=SCHED.find(x=>x.id===el.dataset.gid);if(g)el.parentElement.outerHTML=grpSel(g)})}
async function addPick(o){
  if(!PK.db)return'Picks can only be saved in the claude.ai app.';
  const g=SCHED.find(x=>x.id===o.gid);if(!g)return'Pick a game.';
  if(g.t<=new Date())return'That game has already started.';
  if(!isFinite(o.line)&&o.kind!=='ml')return'Enter a line.';
  const doc={made:new Date().toISOString(),gid:g.id,utc:g.t.toISOString(),etd:ymdET(g.t),a:g.a,h:g.h,kind:o.kind};
  if(o.kind==='prop'){const p=PL[o.pid];if(!p)return'Choose a player.';Object.assign(doc,{player:p.name,team:p.team,stat:o.stat,side:o.side,line:o.line})}
  else if(o.kind==='ml'||o.kind==='spread'){if(o.team!==g.a&&o.team!==g.h)return'Choose a team.';doc.team=o.team;if(o.kind==='spread')doc.line=o.line}
  else Object.assign(doc,{side:o.side,line:o.line});
  const pr=pickProb(g,Object.assign({},o,{line:o.line}));if(pr!=null)doc.model=Math.round(pr*1000)/1000;
  let grp=PK.grp;if(grp==='new')grp=ymdLocal(g.t)+'#'+nextGrpNum(ymdLocal(g.t));if(grp){doc.grp=grp;const nm=(groupsOf(PK.list)[grp]||[]).map(k=>k.gname).find(Boolean);if(nm)doc.gname=nm}
  try{const ref=await PK.col.add(doc);PK.lastId=ref&&ref.id||null;if(grp)PK.grp=grp;return''}catch(e){return'Could not save: '+((e&&(e.message||e.code))||'unknown error')}
}
function formHTML(noType){
  const F=PK.f,up=SCHED.filter(g=>g.t>NOW);
  if(!up.length)return`<div class="empty">No upcoming games in the loaded schedule.</div>`;
  if(!up.find(g=>g.id===F.gid))F.gid=up[0].id;
  const g=up.find(x=>x.id===F.gid);
  const roster=[g.a,g.h].flatMap(t=>PL.filter(p=>p.team===t&&p.avg.min>=5&&stOf(p,g)!=='out').sort((x,y)=>y.avg.min-x.avg.min));
  if(F.kind==='prop'&&!roster.find(p=>String(p.id)===String(F.pid)))F.pid=roster.length?String(roster[0].id):'';
  if((F.kind==='ml'||F.kind==='spread')&&F.team!==g.a&&F.team!==g.h)F.team=g.a;
  const inp='font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff';
  const L=(lab,html,st='')=>`<label style="${st}"><div class="note">${lab}</div>${html}</label>`;
  const sel=(name,opts,cur,st='')=>`<select data-pkf="${name}" style="${inp};${st}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
  let f=L('Game',sel('gid',up.slice(0,40).map(x=>[x.id,`${x.a} @ ${x.h} · ${x.t.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} ${tLocal(x.t)}`]),F.gid,'width:100%'),'flex:2;min-width:230px')
    +(noType?'':L('Type',sel('kind',Object.entries(KIND),F.kind)));
  if(F.kind==='prop')f+=L('Player',sel('pid',roster.map(p=>[p.id,`${p.name} (${p.team})${stOf(p,g)==='q'?' · Q':''}`]),F.pid,'width:100%'),'flex:2;min-width:200px')+L('Stat',sel('k',Object.entries(PSTATS).map(([k,v])=>[k,v.l]),F.k));
  if(F.kind==='ml'||F.kind==='spread')f+=L('Team',sel('team',[[g.a,full(g.a)],[g.h,full(g.h)]],F.team));
  if(F.kind==='prop'||F.kind==='total')f+=L('Over / under',sel('side',[['over','Over'],['under','Under']],F.side));
  if(F.kind!=='ml')f+=L(F.kind==='spread'?'Line (e.g. -4.5)':'Line',`<input data-pkf="line" type="number" step="0.5" value="${esc(F.line)}" placeholder="${F.kind==='spread'?'-4.5':F.kind==='total'?'225.5':'12.5'}" style="${inp};width:110px">`);
  return`<div class="row calcf" style="align-items:flex-end">${f}${PK.db?grpSel(g)+'<button id="pkadd" class="pill on" style="padding:9px 16px;font-size:15px">Add pick</button>':''}</div><div id="pkprev" class="note" style="margin-top:10px">${prevHTML()}</div>`;
}
function curForm(){const F=PK.f;return{gid:F.gid,kind:F.kind,pid:+F.pid,stat:F.k,side:F.side,line:parseFloat(F.line),team:F.team}}
function prevHTML(){
  const o=curForm(),g=SCHED.find(x=>x.id===o.gid);if(!g)return'';
  if(o.kind!=='ml'&&!isFinite(o.line))return PK.msg?`<b>${esc(PK.msg)}</b>${PK.msg==='Saved ✓'?savedLinks():''}`:'Enter a line to see the model\'s chance.';
  const p=pickProb(g,o);const gp=o.kind!=='prop'?gameProj(g):null;return(gp?`Projection: ${g.a} ${Math.round(gp.ap)} – ${g.h} ${Math.round(gp.hp)} (total ${f1(gp.total)}). `:'')+(PK.msg?`<b>${esc(PK.msg)}</b>${PK.msg==='Saved ✓'?savedLinks():''} · `:'')+(p==null?'No model estimate for this pick.':`Model chance for this pick: <b>${Math.round(p*100)}%</b> (fair odds ${fair(p)}).${PK.msg?'':' It\'s saved with the pick.'}`);
}
function vPicks(){
  const head=`<h2>My predictions</h2><p class="sub">Your picks, graded automatically from the box scores after each daily refresh. Click a day to see its picks. Your picks are private to your claude.ai account: anyone else using CourtLens gets their own list.</p>`;
  if(PK.state==='none')return head+`<div class="empty">My predictions are saved per claude.ai account. Open CourtLens at claude.ai while signed in to add and track your picks. This copy can't store them.</div>`;
  if(PK.state==='loading')return head+`<div class="empty">Loading your picks…</div>`;
  if(PK.state==='error')return head+`<div class="empty">${esc(PK.err)}</div>`;
  const addBtn=`<div class="card row" style="justify-content:space-between"><span>Add picks from the Odds calculator on Projections.</span><button class="pill on" data-nav="#proj">+ Add a pick</button></div>`;
  const all=PK.list.map(k=>Object.assign({},k,{g:grade(k),day:ymdLocal(new Date(k.utc))})).sort((x,y)=>x.utc<y.utc?1:x.utc>y.utc?-1:0);
  if(!all.length)return head+addBtn+`<div class="empty">No picks yet. Add one from the Odds calculator on Projections.</div>`;
  const today=ymdLocal(new Date()),tA=tally(all);
  const G=groupsOf(all),gIds=Object.keys(G),gRes=Object.fromEntries(gIds.map(id=>[id,gradeGroup(G[id])])),gA=gTally(gIds.map(id=>gRes[id]));
  const gDay=d=>gTally(gIds.filter(id=>grpDay(id)===d).map(id=>gRes[id]));
  const days=[...new Set(all.map(x=>x.day).concat(gIds.map(grpDay)))].sort().reverse();
  if(!days.includes(PK.day))PK.day=days.includes(today)?today:(days.find(d=>all.some(x=>x.day===d&&x.g.res!=='pending'))||days[0]);
  const dl=d=>{const dt=new Date(d+'T12:00:00');return(d===today?'Today · ':'')+dLong(dt)};
  const rateChip=t=>t.h+t.m?`<span class="chip ${t.rate>=0.6?'up':t.rate<0.4?'down':'flat'}">${rateTxt(t)}</span>`:'<span class="note">—</span>';
  const other=L=>L.filter(x=>x.g.res==='push'||x.g.res==='void').length;
  const settledDays=days.filter(d=>{const t=tally(all.filter(x=>x.day===d));return t.h+t.m>0});
  const best=settledDays.map(d=>[d,tally(all.filter(x=>x.day===d))]).sort((a,b)=>b[1].rate-a[1].rate||b[1].h-a[1].h)[0];
  const kpi=(l,v,s,acc)=>`<div class="kpi"${acc?' style="border-top-color:var(--accent)"':''}><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  // overall: one row per day + totals
  const dayRows=days.map(d=>{const L=all.filter(x=>x.day===d),t=tally(L);return`<tr class="click${d===PK.day?' sel':''}" data-pkday="${d}"><td class="l"><b>${dl(d)}</b></td><td class="num hide-sm">${t.n}</td><td class="num">${t.h}</td><td class="num">${t.m}</td><td class="num hide-sm">${other(L)}</td><td class="num hide-sm">${t.pe}</td><td class="num">${rateChip(t)}</td>${gIds.length?`<td class="num">${(()=>{const q=gDay(d);return q.n?`${q.w}–${q.l}${q.p?` <span class="note">+${q.p}</span>`:''}`:'<span class="note">—</span>'})()}</td>`:''}</tr>`}).join('');
  const totRow=`<tr class="avg"><td class="l">Overall</td><td class="num hide-sm">${tA.n}</td><td class="num">${tA.h}</td><td class="num">${tA.m}</td><td class="num hide-sm">${other(all)}</td><td class="num hide-sm">${tA.pe}</td><td class="num">${rateTxt(tA)}</td>${gIds.length?`<td class="num">${gA.w}–${gA.l}</td>`:''}</tr>`;
  const byType=Object.keys(KIND).map(k=>[k,all.filter(x=>x.kind===k)]).filter(([,L])=>L.length);
  // selected day
  const L=all.filter(x=>x.day===PK.day),t=tally(L),i=days.indexOf(PK.day);
  const dG=gIds.filter(id=>grpDay(id)===PK.day).sort((a,b)=>grpNum(a)-grpNum(b)),gD=gDay(PK.day),singles=L.filter(k=>!k.grp);
  const nav=(d,lab)=>d?`<button class="pill" data-pkday="${d}">${lab}</button>`:`<button class="pill" disabled style="opacity:.4">${lab}</button>`;
  const grpPick=k=>{const ids=gIds.filter(id=>grpDay(id)===PK.day||id===k.grp).sort((a,b)=>grpNum(a)-grpNum(b));return`<select data-pkgrp="${esc(k._id)}" title="Move to a group" aria-label="Group" style="font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-right:6px"><option value="">No group</option>${ids.map(id=>`<option value="${esc(id)}" ${id===k.grp?'selected':''}>${esc(grpName(id,G[id]))}</option>`).join('')}<option value="new">+ New group</option></select>`};
  const acts=k=>`${grpPick(k)}${PK.confirm===k._id?`<button class="pill" data-pkdel="${esc(k._id)}" style="color:#fff;background:var(--bad);border-color:var(--bad)">Remove</button> <button class="pill" data-pkcancel="1">Keep</button>`:`<button class="pill" data-pkask="${esc(k._id)}" title="Remove this pick">Remove</button>`}`;
  const rowsOf=LL=>LL.map(k=>{const[rt,rc]=RES[k.g.res];return`<tr><td class="l">${pickText(k)}<div class="note">${esc(KIND[k.kind]||k.kind)} · ${k.a} @ ${k.h} · ${tLocal(new Date(k.utc))}</div><div class="show-sm" style="margin-top:6px;white-space:nowrap">${acts(k)}</div></td>
     <td class="num">${k.model!=null?Math.round(k.model*100)+'%':'—'}</td><td class="l"><span class="chip ${rc}">${rt}</span>${k.g.act?`<div class="note show-sm" style="white-space:normal;margin-top:3px">${esc(k.g.act)}</div>`:''}</td><td class="l note hide-sm">${esc(k.g.act||'')}</td>
     <td class="hide-sm" style="white-space:nowrap">${acts(k)}</td></tr>`}).join('');
  const dayCard=`<div class="card" id="pkdaycard" style="scroll-margin-top:110px">${PK.note?`<div class="empty" style="margin-bottom:10px">${esc(PK.note)}</div>`:''}<div class="row" style="justify-content:space-between;gap:8px"><h3 style="margin:0">${dl(PK.day)}</h3><div class="row" style="gap:6px">${nav(days[i+1],'← Earlier')}${nav(days[i-1],'Later →')}</div></div>
    <div class="kpis" style="margin:12px 0 8px">${kpi('Hit rate',rateTxt(t),t.h+t.m?`${t.h} of ${t.h+t.m} hit`:'not settled yet',1)}${kpi('Hits',t.h,'')}${kpi('Misses',t.m,'')}${kpi('Pending',t.pe,other(L)?`${other(L)} push/void`:'')}${dG.length?kpi('Groups won',gD.w+gD.l?`${gD.w} of ${gD.w+gD.l}`:'—',gD.p?`${gD.p} pending`:''):''}</div>
    ${dG.map(id=>{const legs=G[id],[rt,rc]=GRES[gRes[id]],mp=legs.every(k=>k.model!=null)?legs.reduce((a,k)=>a*k.model,1):null,hits=legs.filter(k=>k.g.res==='hit').length;
      return`<div style="border:1px solid var(--line);border-left:4px solid ${gRes[id]==='won'?'var(--good)':gRes[id]==='lost'?'var(--bad)':'#94a3b8'};border-radius:6px;margin:12px 0;overflow:hidden"><div class="row" style="justify-content:space-between;padding:8px 12px;background:var(--flatbg)">${PK.ren===id?`<span class="row" style="gap:6px;flex:1;min-width:0"><input id="grpname" data-grpid="${esc(id)}" maxlength="40" value="${esc(grpName(id,legs))}" aria-label="Group name" style="font:inherit;font-weight:700;padding:5px 8px;border:1px solid var(--accent);border-radius:6px;background:#fff;flex:1;min-width:0;max-width:260px"><button class="pill on" data-grpsave="${esc(id)}">Save</button><button class="pill" data-grpcancel="1">Cancel</button></span>`:`<span><b>${esc(grpName(id,legs))}</b> <span class="note">· ${legs.length} pick${legs.length>1?'s':''} · ${hits} hit</span> <button class="pill" data-grpren="${esc(id)}" style="padding:2px 8px;font-size:12px;margin-left:4px">Rename</button></span>`}<span>${mp!=null?`<span class="note">model ${Math.round(mp*100)}% </span>`:''}<span class="chip ${rc}">${rt}</span></span></div>
       <div class="tw" style="padding:0 12px"><table><tbody>${rowsOf(legs)}</tbody></table></div></div>`}).join('')}
    ${singles.length?`${dG.length?'<h3 style="margin:16px 0 4px">Single picks</h3>':''}<div class="tw"><table><thead><tr><th class="l">Pick</th><th>Model</th><th class="l">Result</th><th class="l hide-sm">Actual</th><th></th></tr></thead><tbody>${rowsOf(singles)}</tbody></table></div>`:''}</div>`;
  return head+`<div class="kpis">
     ${kpi('Overall hit rate',rateTxt(tA),tA.h+tA.m?`${tA.h} of ${tA.h+tA.m} hit`:'nothing settled yet',1)}
     ${kpi('Record',`${tA.h}–${tA.m}`,`hits–misses${other(all)?` · ${other(all)} push/void`:''}`)}
     ${kpi('Days tracked',days.length,`${tA.n} picks · ${tA.pe} pending`)}
     ${kpi('Best day',best?rateTxt(best[1]):'—',best?`${dl(best[0])} · ${best[1].h} of ${best[1].h+best[1].m}`:'')}
     ${gIds.length?kpi('Groups won',gRateTxt(gA),`${gA.w} of ${gA.w+gA.l} won${gA.p?` · ${gA.p} pending`:''}`):''}</div>
   ${dayCard}
   <div class="grid2">
    <div class="card"><h3>Daily results</h3><p class="note" style="margin:-4px 0 8px">Click a day to open it above.</p><table><thead><tr><th class="l">Day</th><th class="hide-sm">Picks</th><th>Hit</th><th>Miss</th><th class="hide-sm">Push/void</th><th class="hide-sm">Pending</th><th>Hit rate</th>${gIds.length?'<th title="Groups won–lost">Groups</th>':''}</tr></thead><tbody>${dayRows}${totRow}</tbody></table></div>
    <div class="card"><h3>Overall by type</h3><table><thead><tr><th class="l">Type</th><th>Picks</th><th>Hit</th><th>Miss</th><th>Hit rate</th></tr></thead><tbody>${byType.map(([k,L2])=>{const t2=tally(L2);return`<tr><td class="l">${KIND[k]}</td><td class="num">${t2.n}</td><td class="num">${t2.h}</td><td class="num">${t2.m}</td><td class="num">${rateChip(t2)}</td></tr>`}).join('')}<tr class="avg"><td class="l">All picks</td><td class="num">${tA.n}</td><td class="num">${tA.h}</td><td class="num">${tA.m}</td><td class="num">${rateTxt(tA)}</td></tr></tbody></table></div>
   </div>
   ${addBtn}
   <div class="card note"><b>How grading works.</b> Each pick is checked against the box scores loaded in the daily refresh (6 PM Singapore), so results show up the evening after the games. Hit rate = hits ÷ (hits + misses). Pushes (exactly on the line), voids (player didn't play) and pending picks don't count. Picks are grouped by the day the game tips off in your time zone. "Model" is CourtLens's estimated chance when you made the pick. For game totals it assumes a spread of about ±17 points. <b>Groups</b> work like a parlay: a group is won only if every pick in it hits. A push or void pick is dropped from the group, and one miss loses the whole group. The group's model chance is its picks' chances multiplied together.</div>`;
}
function wirePicks(){
  const box=$('#pkform');if(!box)return;
  const re=()=>{box.innerHTML=formHTML(true);wirePicks()};
  box.querySelectorAll('[data-pkf]').forEach(el=>{const n=el.dataset.pkf;
    el[n==='line'?'oninput':'onchange']=()=>{PK.f[n]=el.value;PK.msg='';if(n==='line'){const pv=$('#pkprev');if(pv)pv.innerHTML=prevHTML()}else re()}});
  const b=$('#pkadd');if(b)b.onclick=async()=>{b.disabled=true;const err=await addPick(curForm());PK.msg=err||'Saved ✓';rerenderPicks();const pv=$('#pkprev');if(pv)pv.innerHTML=prevHTML();if(b.isConnected)b.disabled=false};
}

/* ===== router ===== */
function render(){
  const h=(location.hash||'#proj').slice(1),i=h.indexOf('-'),base=i<0?h:h.slice(0,i),arg=i<0?'':h.slice(i+1);
  const top={team:'teams',game:'schedule',player:'players'}[base]||base;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav==='#'+top));
  {const nv=$('nav'),on=nv&&nv.querySelector('a.on');if(on&&nv.scrollWidth>nv.clientWidth){const l=on.offsetLeft-nv.offsetLeft;if(l<nv.scrollLeft||l+on.offsetWidth>nv.scrollLeft+nv.clientWidth)nv.scrollLeft=l-16}}
  $('#view').innerHTML=base==='injuries'?vInjuries():base==='proj'?vProj(arg):base==='team'?vTeam(arg):base==='game'?vGame(arg):base==='player'?vPlayer(arg):base==='players'?vPlayers():base==='schedule'?vSchedule():base==='teams'?vTeams():base==='picks'?vPicks():vProj(arg);
  if($('#pkform'))wirePicks();
  const li=$('#pjline');if(li)li.oninput=()=>{const v=parseFloat(li.value);if(!isFinite(v))return;PJ.line[li.dataset.pjk]=v;const x=PL[PJ.pl],g=SCHED.find(z=>z.id===(arg||'')) ||SCHED.filter(z=>z.t>NOW-3*3600e3)[0];const pr=pproj(x,g,PJ.stat);$('#pjres').innerHTML=lineRes(x,pr,PJ.stat,v)};
  if(base==='proj'||base===''||!['team','game','player','players','schedule','teams','injuries','picks'].includes(base))wireCalc();
  const pr=$('#pjpills'),po=pr&&pr.querySelector('.pill.on');if(po)pr.scrollLeft=po.offsetLeft-pr.clientWidth/2+po.offsetWidth/2;
  if(base==='players'){const el=$('#pq');el.oninput=()=>{pq=el.value;const c=el.selectionStart;render();const e2=$('#pq');e2.focus();e2.setSelectionRange(c,c)}}
}
document.addEventListener('change',e=>{
  const gs=e.target.closest('[data-grpsel]');if(gs){PK.grp=gs.value;return}
  const pg=e.target.closest('[data-pkgrp]');if(pg&&PK.db){let v=pg.value;if(v==='new')v=PK.day+'#'+nextGrpNum(PK.day);pg.disabled=true;
    const nm=v?(groupsOf(PK.list)[v]||[]).map(k=>k.gname).find(Boolean)||null:null;PK.col.doc(pg.dataset.pkgrp).update({grp:v||null,gname:nm}).then(()=>{PK.note=''}).catch(err=>{PK.note='Could not change group: '+((err&&(err.message||err.code))||'error');rerenderPicks()})}
});
document.addEventListener('click',e=>{
  const ck=e.target.closest('[data-ck]');if(ck){PK.f.kind=ck.dataset.ck;PK.msg='';if(CALC.pid!=null){const p=PL[CALC.pid],g=SCHED.find(x=>(x.a===p.team||x.h===p.team)&&x.t>NOW);if(g)PK.f.gid=g.id}updatePkCard();return}
  const cp=e.target.closest('[data-calcp]');if(cp){const p=PL[+cp.dataset.calcp];CALC.pid=p.id;CALC.k='pts';CALC.side='over';CALC.line=(Math.floor(pproj(p,p.nextGame||SCHED.find(x=>(x.a===p.team||x.h===p.team)&&x.t>NOW-3*3600e3),'pts').proj)+0.5).toFixed(1);PK.f.kind='prop';const c=$('#calccard');if(c){c.innerHTML=calcInner();wireCalc();if($('#pkform'))wirePicks();c.scrollIntoView({behavior:'smooth',block:'start'})}return}
  const ca=e.target.closest('#c_addpk');if(ca){const p=PL[CALC.pid],g=p&&SCHED.find(x=>(x.a===p.team||x.h===p.team)&&x.t>NOW-3*3600e3);ca.disabled=true;
    addPick({gid:g&&g.id,kind:'prop',pid:CALC.pid,stat:CALC.k,side:CALC.side,line:parseFloat(CALC.line)}).then(err=>{const m=$('#c_addmsg');if(m)m.innerHTML=err?esc(err):'Saved ✓ '+savedLinks();ca.disabled=false});return}
  const gr=e.target.closest('[data-grpren]');if(gr){PK.ren=gr.dataset.grpren;rerenderPicks();const inp=$('#grpname');if(inp){inp.focus();inp.select()}return}
  const gc=e.target.closest('[data-grpcancel]');if(gc){PK.ren=null;rerenderPicks();return}
  const gsv=e.target.closest('[data-grpsave]');if(gsv){saveGrpName(gsv.dataset.grpsave);return}
  const pdy=e.target.closest('[data-pkday]');if(pdy){PK.day=pdy.dataset.pkday;PK.confirm=null;PK.note='';rerenderPicks();const c=$('#pkdaycard');if(c&&c.getBoundingClientRect().top<0)c.scrollIntoView({block:'start'});return}
  const pa=e.target.closest('[data-pkask]');if(pa){PK.confirm=pa.dataset.pkask;PK.note='';rerenderPicks();return}
  const pd=e.target.closest('[data-pkdel]');if(pd){const id=pd.dataset.pkdel;PK.confirm=null;pd.disabled=true;removePick(id,err=>{PK.note=err||'Pick removed.';rerenderPicks()});return}
  const pc=e.target.closest('[data-pkcancel]');if(pc){PK.confirm=null;rerenderPicks();return}
  const pu=e.target.closest('[data-pkundo]');if(pu){e.preventDefault();const id=pu.dataset.pkundo;removePick(id,err=>{const m=err||'Pick removed.';const cm=$('#c_addmsg');if(cm)cm.textContent=m;else{PK.msg=m;const pv=$('#pkprev');if(pv)pv.innerHTML=prevHTML()}});return}
  if(PK.confirm&&!e.target.closest('[data-pkdel]')){PK.confirm=null;rerenderPicks()}
  const ps=e.target.closest('[data-pjs]');if(ps){PJ.stat=ps.dataset.pjs;const y=scrollY;render();scrollTo(0,y);return}
  const pp=e.target.closest('[data-pjp]');if(pp){PJ.pl=PJ.pl===+pp.dataset.pjp?null:+pp.dataset.pjp;if(PJ.pl!=null){CALC.pid=PJ.pl;CALC.k=PJ.stat;CALC.line=(Math.floor(sv(PL[PJ.pl].avg,PJ.stat))+0.5).toFixed(1);PK.f.kind='prop'}render();if(PJ.pl!=null){const d=$('#pjdet');d&&d.scrollIntoView({behavior:'smooth',block:'start'})}return}
  const vb=e.target.closest('[data-vsp]');if(vb){vsSel[+vb.dataset.vsp]=vb.dataset.vso;const y=scrollY;render();scrollTo(0,y);return}
  const s=e.target.closest('[data-selp]');
  if(s){const p=+s.dataset.selp,i=+s.dataset.seli;sel[p]=sel[p]===i?undefined:i;const y=scrollY;render();scrollTo(0,y);return}
  const a=e.target.closest('[data-nav]');
  if(a){e.preventDefault();e.stopPropagation();const h=a.dataset.nav;const m=h.match(/^#player-(\d+)$/);if(m&&a.dataset.vs)vsSel[+m[1]]=a.dataset.vs;if(location.hash===h)render();else location.hash=h;scrollTo(0,0)}
});
addEventListener('hashchange',render);
let lastMob=MOB();addEventListener('resize',()=>{const m=MOB();if(m!==lastMob){lastMob=m;const y=scrollY;render();scrollTo(0,y)}});
render();
</script>
</body>
</html>
