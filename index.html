<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CourtLens</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceeea;--card:#fafaf8;--ink:#17202b;--muted:#5d6670;--line:#d6dad3;--accent:#e35a12;--paint:#fbe9dc;--good:#1e7a46;--goodbg:#dcefe2;--bad:#b4232c;--badbg:#f8e0e0;--flatbg:#e6e9e4;--head:#1a2b45;--headsoft:#b7c2d3;--cond:'Barlow Condensed','Arial Narrow',sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--head);color:#fff;padding:0 20px;display:flex;align-items:stretch;gap:28px;flex-wrap:wrap;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--accent)}
header h1{font-family:var(--cond);font-style:italic;font-weight:800;font-size:27px;margin:0;padding:9px 0 7px;letter-spacing:.005em;line-height:1}
nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav a{font-family:var(--cond);font-size:18px;font-weight:600;color:var(--headsoft);text-decoration:none;padding:12px 12px 9px;cursor:pointer;position:relative;white-space:nowrap}
nav a:hover{color:#fff}
nav a.on{color:#fff}
nav a.on::after{content:'';position:absolute;left:8px;right:8px;bottom:-3px;height:6px;background:var(--accent);border-radius:3px 3px 0 0}
.asof{margin-left:auto;align-self:center;font-size:13px;color:var(--headsoft)}
@media(max-width:700px){header{gap:0 16px;padding:0 16px}header h1{font-size:24px}nav{order:3;width:100%;margin:0 -12px}.asof{margin-left:0;font-size:12px;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{padding:18px 16px 40px}h2{font-size:30px}.card{padding:14px}}
main{max-width:1200px;margin:0 auto;padding:24px 20px 48px}
h2{font-family:var(--cond);font-size:36px;font-weight:700;line-height:1.05;margin:4px 0 6px}
h3{font-family:var(--cond);font-size:20px;font-weight:600;margin:0 0 10px;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 20px;max-width:72ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px;overflow-x:auto}
.grid2>*,.mh>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px 20px;margin-bottom:20px}
.kpi{border-top:2px solid var(--ink);padding:8px 0 4px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--cond);font-size:32px;font-weight:700;line-height:1.05;margin-top:2px}
.kpi .s{font-size:13px;color:var(--muted)}
.card .kpi,.row>.kpi{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--ink);border-radius:0 0 6px 6px;padding:8px 12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-family:var(--cond);font-size:15px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tr.avg td{background:var(--flatbg);font-weight:700}
tr.click{cursor:pointer}
tr.click:hover td{background:#f1f2ee}
tr.sel td{background:var(--paint)!important}
.num{font-size:14px}
.chip{display:inline-block;padding:1px 6px;border-radius:3px;font-size:12px;font-weight:600}
.up{background:var(--goodbg);color:var(--good)}
.down{background:var(--badbg);color:var(--bad)}
.flat{background:var(--flatbg);color:#4a535c}
.tabbr{display:inline-block;min-width:38px;font-family:var(--cond);font-size:16px;font-weight:700;color:var(--accent)}
.link{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:#a9b0a6;text-underline-offset:3px}
.link:hover{color:var(--accent);text-decoration-color:currentColor}
.back{color:var(--muted);cursor:pointer;font-weight:600;display:inline-block;margin-bottom:6px}
.back:hover{color:var(--accent)}
.verdict{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:4px;font-weight:600}
.bar{position:relative;height:10px;background:var(--flatbg);border-radius:5px;width:200px;max-width:100%}
.bar .g{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar .a{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
input[type=search],input[type=number],select{font:inherit;border:1px solid #c3c8c0;border-radius:4px;padding:8px 10px;background:#fff;color:var(--ink)}
input[type=search]{width:100%}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--paint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.date{font-family:var(--cond);font-size:20px;font-weight:600;color:var(--ink);margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.gm{display:grid;grid-template-columns:1fr 1.5rem 1fr minmax(9rem,14rem);gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;margin-bottom:6px}
.gm:hover{border-color:var(--accent)}
.gm .tm{font-family:var(--cond);font-size:21px;font-weight:700;line-height:1.1}
.gm .tm small{display:block;font-family:Barlow,sans-serif;font-weight:500;color:var(--muted);font-size:13px}
.gm .at{color:var(--muted);font-weight:600}
.gm .time{font-size:13px;color:var(--muted);text-align:right}
@media(max-width:560px){.gm{grid-template-columns:1fr auto 1fr}.gm .time{grid-column:1/-1;text-align:left}}
.mh{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.mh .side{text-align:center}
.mh .nm{font-family:var(--cond);font-size:26px;font-weight:700}
.mh .rec{color:var(--muted)}
.vsbox{text-align:center;color:var(--muted);font-family:var(--cond);font-size:22px;font-weight:600}
.card.board{background:var(--head);border-color:var(--head);color:#fff;padding:22px 18px 16px}
.board .nm .link{color:#fff;text-decoration-color:#4c5f7d}
.board .rec,.board .vsbox,.board .note{color:var(--headsoft)}
.board .score{font-family:var(--cond);font-size:68px;font-weight:700;line-height:.95;margin:2px 0 6px}
.board .lead .score{color:var(--accent)}
@media(max-width:560px){.board .score{font-size:50px}.mh .nm{font-size:22px}}
.pill{font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:4px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.calc{border:2px solid var(--ink)}
svg text{font-family:Barlow,sans-serif}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.note{font-size:13px;color:var(--muted)}
.empty{padding:14px;color:var(--muted);background:var(--flatbg);border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const INJP={};INJ.forEach(i=>{if(i.p)INJP[i.p.id]=i});

const etDay=d=>new Date(d.toLocaleDateString('en-CA',{timeZone:'America/New_York'})+'T00:00:00Z');
function stOf(p,g){const i=INJP[p.id];if(!i)return null;const gd=etDay(g.t);
  if(i.st==='Out')return gd<i.retD?'out':+gd===+i.retD?'q':null;
  const nx=nextFor(p.team);return nx&&nx.id===g.id?'q':null}
function injFor(t,g){return INJ.filter(i=>i.t===t&&(g?(i.p?stOf(i.p,g):(i.st==='Out'&&etDay(g.t)<i.retD?'out':null)):true))}
function onOff(p){const tg=T[p.team].games,dates=new Set(p.log.filter(r=>r.tm===p.team).map(r=>r.d.slice(2)));
  const agg=G=>{const ps=G.reduce((s,x)=>s+x.poss,0);return G.length?{n:G.length,w:G.filter(x=>x.wl==='W').length,o:100*G.reduce((s,x)=>s+x.pts,0)/ps,d:100*G.reduce((s,x)=>s+x.opp,0)/ps}:null};
  return{on:agg(tg.filter(x=>dates.has(x.d))),off:agg(tg.filter(x=>!dates.has(x.d)))}}
function teamAdj(t,g){
  const outs=PL.filter(p=>p.team===t&&stOf(p,g)==='out');const Tm=T[t];let o=0,d=0;
  outs.forEach(p=>{const share=Math.min(1,p.log.filter(r=>r.tm===t).length/Math.max(1,Tm.games.length));
    o-=0.3*(p.avg.pts+0.6*p.avg.ast)*100/Tm.pace*share;d+=0.15*(p.avg.stl+p.avg.blk+0.2*p.avg.reb)*100/Tm.pace*share});
  return{outs,o,d,stars:outs.filter(isStar)};
}
function boostFor(p,g,k){
  const adj=teamAdj(p.team,g);if(!adj.outs.length)return 1;
  const v=x=>sv(x.avg,k);
  const Tm=T[p.team],lost=adj.outs.reduce((s,x)=>s+v(x)*Math.min(1,x.log.filter(r=>r.tm===p.team).length/Math.max(1,Tm.games.length)),0);
  const pool=PL.filter(x=>x.team===p.team&&x.avg.min>=10&&active(x)&&stOf(x,g)!=='out').reduce((s,x)=>s+v(x),0);
  return pool>0?Math.min(1.35,1+0.7*lost/pool):1;
}
const stBadge=s=>s==='out'?'<span class="chip down">OUT</span>':s==='q'?'<span class="chip" style="background:#fef3c7;color:#92400e">Q</span>':'';
function impactCard(t,g){
  const adj=g?teamAdj(t,g):{stars:INJ.filter(i=>i.t===t&&i.st==='Out'&&isStar(i.p)).map(i=>i.p)};
  if(g&&!adj.outs.length)return'';
  const stars=g?adj.stars:adj.stars;
  const A=g?adj:(()=>{const fake={t:new Date(Date.now()+864e5)};return teamAdj(t,SCHED.find(x=>(x.a===t||x.h===t)&&x.t>NOW-3*3600e3)||fake)})();
  const Tm=T[t];
  const mates=PL.filter(x=>x.team===t&&x.avg.min>=12&&active(x)&&!A.outs.includes(x)).map(x=>{const gg=g||SCHED.find(z=>(z.a===t||z.h===t)&&z.t>NOW-3*3600e3);return{x,b:gg?boostFor(x,gg,'pts'):1}}).sort((a,b)=>b.x.avg.pts*(b.b-1)-a.x.avg.pts*(a.b-1)).slice(0,4);
  return`<div class="card"><h3>${esc(full(t))} · impact of absences${g?' for this game':''}</h3>
   ${A.outs.length?`<p style="margin:0 0 10px">Out: ${A.outs.map(p=>`${plink(p)}${isStar(p)?' <span class="chip" style="background:#fde68a;color:#92400e">★ star</span>':''} <span class="note">${f1(p.avg.pts)}/${f1(p.avg.reb)}/${f1(p.avg.ast)}</span>`).join(' · ')}</p>`:''}
   <div class="kpis" style="margin-bottom:10px">
    <div class="kpi"><div class="l">Off rtg</div><div class="v" style="font-size:18px">${f1(Tm.ortg+A.o)}</div><div class="s">${dchip(A.o,true,0.2)} from ${f1(Tm.ortg)}</div></div>
    <div class="kpi"><div class="l">Def rtg</div><div class="v" style="font-size:18px">${f1(Tm.drtg+A.d)}</div><div class="s">${dchip(A.d,false,0.2)} from ${f1(Tm.drtg)}</div></div>
    <div class="kpi"><div class="l">Net rtg</div><div class="v" style="font-size:18px">${sgn(Tm.net+A.o-A.d)}</div><div class="s">${dchip(A.o-A.d,true,0.2)} estimated</div></div></div>
   ${stars.length?`<div class="tw"><table><thead><tr><th class="l">Star</th><th>Team with him</th><th>Off / Def</th><th>Without him</th><th>Off / Def</th></tr></thead><tbody>${stars.map(p=>{const oo=onOff(p);return`<tr><td class="l">${plink(p)}</td><td class="num">${oo.on?oo.on.w+'-'+(oo.on.n-oo.on.w):'—'}</td><td class="num">${oo.on?f1(oo.on.o)+' / '+f1(oo.on.d):'—'}</td><td class="num">${oo.off?oo.off.w+'-'+(oo.off.n-oo.off.w):'0 games'}</td><td class="num">${oo.off?f1(oo.off.o)+' / '+f1(oo.off.d)+' '+dchip((oo.off.o-oo.off.d)-(oo.on.o-oo.on.d),true,1):'—'}</td></tr>`}).join('')}</tbody></table><p class="note">Actual 2026-27 team results with and without each star (small samples — read with care).</p></div>`:''}
   ${mates.length?`<p class="note" style="margin-top:8px"><b>Likely to pick up the slack (points):</b> ${mates.filter(m=>m.b>1.005).map(m=>`${esc(m.x.name)} ${f1(m.x.avg.pts)} → ~${f1(m.x.avg.pts*m.b)}`).join(' · ')||'—'}</p>`:''}
   <p class="note">Estimate: the team loses about 30% of the missing players' scoring and playmaking (the rest is made up by teammates), adjusted for how much of the season he has already missed. Teammates' projections are raised in proportion to their usual output.</p></div>`;
}
function vInjuries(){
  const teams=Object.keys(TEAMS).map(t=>({t,list:INJ.filter(i=>i.t===t)})).filter(x=>x.list.length).sort((a,b)=>b.list.filter(i=>i.st==='Out'&&isStar(i.p)).length-a.list.filter(i=>i.st==='Out'&&isStar(i.p)).length||full(a.t).localeCompare(full(b.t)));
  const starsOut=INJ.filter(i=>i.st==='Out'&&isStar(i.p));

  <div class="card"><h3>Stars out (${starsOut.length})</h3>${starsOut.length?`<div class="row">${starsOut.map(i=>`<a class="chip down" style="cursor:pointer" data-nav="#player-${i.p.id}">${esc(i.p.name)} · ${i.t} · back ~${i.ret}</a>`).join('')}</div>`:'<div class="empty">None.</div>'}</div>
  ${teams.map(({t,list})=>`<div class="card tw"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${tlink(t)}</h3>${(()=>{const n=nextFor(t);return n?`<span class="note">Next: ${n.h===t?'vs':'@'} ${n.h===t?n.a:n.h} · ${dLong(n.t)}</span>`:''})()}</div>
   <table style="margin-top:8px"><thead><tr><th>Player</th><th class="l">Pos</th><th class="l">Status</th><th class="l">Est. return</th><th>GP</th><th>PTS</th><th>REB</th><th>AST</th><th>MIN</th></tr></thead><tbody>
   ${list.map(i=>`<tr><td>${i.p?plink(i.p):esc(i.name)} ${isStar(i.p)?'<span class="chip" style="background:#fde68a;color:#92400e">★</span>':''}</td><td class="l">${i.pos}</td><td class="l">${i.st==='Out'?'<span class="chip down">Out</span>':'<span class="chip" style="background:#fef3c7;color:#92400e">Day-to-day</span>'}</td><td class="l">${i.ret}</td>${i.p?`<td class="num">${i.p.gp}</td><td class="num">${f1(i.p.avg.pts)}</td><td class="num">${f1(i.p.avg.reb)}</td><td class="num">${f1(i.p.avg.ast)}</td><td class="num">${f1(i.p.avg.min)}</td>`:'<td colspan="5" class="note">no games this season</td>'}</tr>`).join('')}</tbody></table>
   ${list.some(i=>i.st==='Out'&&isStar(i.p))?impactCard(t,null).replace('<div class="card">','<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">'):''}</div>`).join('')}`;
}

/* ===== shared UI ===== */
const rankChip=(rk)=>`<span class="chip ${rk<=10?'up':rk>20?'down':'flat'}">#${rk}</span>`;
function dchip(d,goodUp=true,th=0.05,suf=''){if(d==null||!isFinite(d))return'';const good=goodUp?d>th:d<-th,bad=goodUp?d<-th:d>th;return`<span class="chip ${good?'up':bad?'down':'flat'}">${sgn(d)}${suf}</span>`}
function verdict(p,r){const z=(r.gs-p.gsAvg)/p.gsSd;
  if(z>1)return{t:'Well above his average',c:'up',e:'▲▲'};if(z>0.35)return{t:'Above his average',c:'up',e:'▲'};
  if(z>=-0.35)return{t:'Around his average',c:'flat',e:'●'};if(z>=-1)return{t:'Below his average',c:'down',e:'▼'};return{t:'Well below his average',c:'down',e:'▼▼'}}
function form(p){if(p.l10.length<4)return{t:'Few games',c:'flat'};const a=p.l10.slice(0,5).reduce((s,r)=>s+r.gs,0)/Math.min(5,p.l10.length),d=a-p.gsAvg;
  return d>0.45*p.gsSd?{t:'Hot',c:'up'}:d<-0.45*p.gsSd?{t:'Cold',c:'down'}:{t:'Steady',c:'flat'}}
const vdot=v=>`<span class="dot" style="background:${v.c==='up'?'var(--good)':v.c==='down'?'var(--bad)':'#94a3b8'}"></span>`;
const tlink=a=>`<a class="link" data-nav="#team-${a}">${esc(full(a))}</a>`;
const plink=p=>`<a class="link" data-nav="#player-${p.id}">${esc(p.name)}</a>`;
const glabel=g=>`${dLong(g.t)} · ${tLocal(g.t)} <span class="note">(${tET(g.t)})</span>`;
function gameCard(g){const A=T[g.a],H=T[g.h];return`<div class="gm" data-nav="#game-${g.id}">
  <div class="tm">${esc(full(g.a))}<small>${A.w}-${A.l} · O ${f1(A.ortg)} · D ${f1(A.drtg)}</small></div><div class="at">@</div>
  <div class="tm">${esc(full(g.h))}<small>${H.w}-${H.l} · O ${f1(H.ortg)} · D ${f1(H.drtg)}</small></div>
  <div class="time">${dLong(g.t)}<br><b>${tLocal(g.t)}</b>${g.tv?`<br>${esc(g.tv)}`:''}</div></div>`}

  <div class="card"><h3>Offense vs defense</h3>${scatter(TL)}<div class="legend">Up and to the right = good at both ends. Dashed lines = league average. Click a team.</div></div>`;

function scatter(TL){
  const W=760,H=400,m={l:50,r:24,t:20,b:40},xs=TL.map(t=>t.ortg),ys=TL.map(t=>t.drtg);
  const x0=Math.min(...xs)-1.5,x1=Math.max(...xs)+1.5,y0=Math.min(...ys)-1.5,y1=Math.max(...ys)+1.5;
  const X=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r),Y=v=>m.t+(v-y0)/(y1-y0)*(H-m.t-m.b);
  let g='';for(let v=Math.ceil(x0/2)*2;v<=x1;v+=2)g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H-m.b}" stroke="#f1f5f9"/><text x="${X(v)}" y="${H-m.b+16}" font-size="11" fill="#6b7280" text-anchor="middle">${v}</text>`;
  for(let v=Math.ceil(y0/2)*2;v<=y1;v+=2)g+=`<line y1="${Y(v)}" y2="${Y(v)}" x1="${m.l}" x2="${W-m.r}" stroke="#f1f5f9"/><text x="${m.l-8}" y="${Y(v)+4}" font-size="11" fill="#6b7280" text-anchor="end">${v}</text>`;
  return`<svg viewBox="0 0 ${W} ${H}" width="100%">${g}
  <line x1="${X(LG.o)}" x2="${X(LG.o)}" y1="${m.t}" y2="${H-m.b}" stroke="#94a3b8" stroke-dasharray="4 4"/><line y1="${Y(LG.d)}" y2="${Y(LG.d)}" x1="${m.l}" x2="${W-m.r}" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="${W-m.r-4}" y="${m.t+14}" text-anchor="end" font-size="11" font-weight="700" fill="#15803d">Good O · Good D</text>
  <text x="${m.l+6}" y="${H-m.b-8}" font-size="11" font-weight="700" fill="#b91c1c">Bad O · Bad D</text>
  <text x="${(W+m.l)/2}" y="${H-4}" font-size="11" fill="#6b7280" text-anchor="middle">Offensive rating →</text>
  <text transform="translate(13 ${H/2}) rotate(-90)" font-size="11" fill="#6b7280" text-anchor="middle">Defensive rating (better ↑)</text>
  ${TL.map(t=>`<g data-nav="#team-${t.abbr}" style="cursor:pointer"><circle cx="${X(t.ortg)}" cy="${Y(t.drtg)}" r="7" fill="${t.net>=0?'#e35a12':'#64748b'}" stroke="#fff" stroke-width="2"/><text x="${X(t.ortg)+10}" y="${Y(t.drtg)+4}" font-size="11.5" font-weight="700" fill="#121620">${t.abbr}</text><title>${full(t.abbr)}: O ${t.ortg} · D ${t.drtg}</title></g>`).join('')}</svg>`;
}
function vSchedule(){
  let out='',cur='';
  SCHED.filter(g=>g.t>NOW-3*3600e3).forEach(g=>{const k=dLong(g.t);if(k!==cur){cur=k;out+=`<div class="date">${g.t.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div>`}out+=gameCard(g)});
  return`<h2>Upcoming games</h2><p class="sub">From the NBA.com schedule. Times are in your local time zone (Eastern time in brackets). Click a game for the matchup.</p>${out||'<div class="empty">No upcoming games in the loaded schedule — the data needs a refresh.</div>'}`;
}
function rotation(a){return PL.filter(p=>p.team===a).sort((x,y)=>y.avg.min-x.avg.min)}
function vGame(id){
  const g=SCHED.find(x=>x.id===id);if(!g)return vSchedule();
  const A=T[g.a],H=T[g.h];
  const bar=(lab,a,h,goodHigh)=>{const mx=Math.max(a,h),mn=Math.min(a,h)-3,wa=(a-mn)/(mx-mn)*100,wh=(h-mn)/(mx-mn)*100,aw=goodHigh?a>h:a<h;
    return`<div class="cmpbar"><div class="v" style="text-align:right;color:${aw?'var(--good)':'inherit'}">${f1(a)}</div><div class="hb l"><i style="width:${wa}%;background:${aw?'#e35a12':'#94a3b8'}"></i></div><div class="lab">${lab}</div><div class="hb r"><i style="width:${wh}%;background:${!aw?'#e35a12':'#94a3b8'}"></i></div><div class="v" style="color:${!aw?'var(--good)':'inherit'}">${f1(h)}</div></div>`};
  const roster=(t)=>{const o=t===g.a?g.h:g.a;const R=rotation(t).filter(p=>stOf(p,g)!=='out');return`<div class="card tw"><h3>${esc(full(t))}</h3><table><thead><tr><th>Player</th><th>MIN</th><th>PTS</th><th>Last 10 PTS</th><th>Last 3 vs ${o}</th><th>REB</th><th>AST</th><th class="l">Form</th></tr></thead><tbody>
   ${R.map(p=>{const l=avgOf(p.l10),vr=p.vs[o]||[],v=vr.length?avgOf(vr):null,fm=form(p);return`<tr class="click" data-nav="#player-${p.id}" data-vs="${o}"><td><b>${esc(p.name)}</b> ${stBadge(stOf(p,g))}</td><td class="num">${f1(p.avg.min)}</td><td class="num"><b>${f1(p.avg.pts)}</b></td><td class="num">${f1(l.pts)} ${dchip(l.pts-p.avg.pts,true,1)}</td><td class="num">${v?f1(v.pts)+' '+dchip(v.pts-p.avg.pts,true,1)+` <span class="note">(${vr.length})</span>`:'<span class="note">no games</span>'}</td><td class="num">${f1(p.avg.reb)}</td><td class="num">${f1(p.avg.ast)}</td><td class="l"><span class="chip ${fm.c}">${fm.t}</span></td></tr>`}).join('')}
   </tbody></table><div class="legend">PTS = season average; chips show the difference from it. (n) = games found vs ${o} since 2024-25. Sorted by minutes.</div></div>`};
  return`<span class="back" data-nav="#schedule">← Schedule</span>
  <div class="card"><div class="mh"><div class="side"><div class="nm">${tlink(g.a)}</div><div class="rec">${A.w}-${A.l} · away</div></div><div class="vsbox">@</div><div class="side"><div class="nm">${tlink(g.h)}</div><div class="rec">${H.w}-${H.l} · home</div></div></div>

  <div class="card"><h3>Ratings head to head</h3>
   ${bar('Off rtg',A.ortg,H.ortg,true)}${bar('Def rtg',A.drtg,H.drtg,false)}${bar('Net rtg',A.net,H.net,true)}${bar('Pace',A.pace,H.pace,true)}${bar('L5 net',A.l5net,H.l5net,true)}
   <div class="legend">Orange = the better side for that measure (lower is better for defensive rating). Pace has no "better", it just shows who plays faster.</div></div>
  ${(()=>{const c=[g.a,g.h].map(t=>impactCard(t,g)).join('');return c?`<div class="grid2">${c}</div>`:''})()}
  <div class="grid2">${roster(g.a)}${roster(g.h)}</div>`;
}

function pOver(pr,k,line){if(PSTATS[k].dist==='p')return 1-pois(pr.proj,Math.floor(line));return 1-Phi((line-pr.proj)/pr.sd)}

const PJ={stat:'pts',pl:null,line:{}};

const CALC={pid:null,k:'pts',line:'',side:'over',odds:''};
function calcCard(){
  const opts=PL.filter(p=>p.avg.min>=5).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${esc(p.name)} (${p.team})"></option>`).join('');
  const cur=CALC.pid!=null?`${PL[CALC.pid].name} (${PL[CALC.pid].team})`:'';
  const inp='font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff';
  return`<div class="card calc"><h3>Odds calculator</h3>
   <div class="row" style="align-items:flex-end">
    <label style="flex:2;min-width:220px"><div class="note">Player</div><input id="c_pl" list="c_pls" value="${esc(cur)}" placeholder="Start typing a name…" style="${inp};width:100%"><datalist id="c_pls">${opts}</datalist></label>
    <label><div class="note">Stat</div><select id="c_k" style="${inp}">${Object.entries(PSTATS).map(([k,v])=>`<option value="${k}" ${k===CALC.k?'selected':''}>${v.l}</option>`).join('')}</select></label>
    <label><div class="note">Over / under</div><select id="c_side" style="${inp}"><option value="over" ${CALC.side==='over'?'selected':''}>Over</option><option value="under" ${CALC.side==='under'?'selected':''}>Under</option></select></label>
    <label><div class="note">Line</div><input id="c_line" type="number" step="0.5" value="${esc(CALC.line)}" placeholder="12.5" style="${inp};width:90px"></label>
    <label><div class="note">Bookmaker odds (optional)</div><input id="c_odds" type="number" step="0.01" value="${esc(CALC.odds)}" placeholder="e.g. 1.85" style="${inp};width:120px"></label>
   </div><div id="c_out" style="margin-top:14px">${calcOut()}</div></div>`;
}
function calcOut(){
  if(CALC.pid==null)return`<div class="empty">Choose a player, a stat and a line. Example: Andrew Nembhard, Points, Over 12.5.</div>`;
  const p=PL[CALC.pid],k=CALC.k,S=PSTATS[k],ln=parseFloat(CALC.line);
  const g=SCHED.find(x=>(x.a===p.team||x.h===p.team)&&x.t>NOW-3*3600e3);
  if(!g)return`<div class="empty">No upcoming game for ${esc(p.team)} in the loaded schedule.</div>`;
  if(!isFinite(ln))return`<div class="empty">Enter a line, e.g. ${(Math.floor(sv(p.avg,k))+0.5).toFixed(1)}.</div>`;
  const st=stOf(p,g),opp=g.h===p.team?g.a:g.h;
  if(st==='out')return`<div class="empty"><b>${esc(p.name)} is listed Out</b> for ${g.h===p.team?'vs':'@'} ${opp} on ${dLong(g.t)} (ESPN, back ~${INJP[p.id].ret}). No projection.</div>`;
  const pr=pproj(p,g,k),pm=pOver(pr,k,ln),po=pFinal(p,pr,k,ln),pw=CALC.side==='over'?po:1-po,side=CALC.side==='over'?'Over':'Under';
  const vr=p.vs[opp]||[],l10=p.l10,vals=l10.map(r=>sv(r,k));
  const hitS=(rows)=>{const n=rows.filter(r=>CALC.side==='over'?sv(r,k)>ln:sv(r,k)<ln).length;return rows.length?`${n} of ${rows.length} (${Math.round(n/rows.length*100)}%)`:'no games'};
  const minL=avgOf(l10).min,minS=p.avg.min,fm=form(p),adj=teamAdj(p.team,g);
  const why=[];
  why.push(`<b>Projection: ${f1(pr.proj)} ${S.l.toLowerCase()}</b> for ${g.h===p.team?'vs':'@'} ${esc(full(opp))} on ${dLong(g.t)} (${tLocal(g.t)}).`);
  why.push(`Built from his season average of ${f1(pr.sea)} over ${p.gp} games (weight 50%), his last ${l10.length} average of ${f1(pr.l10)} (35%)${pr.vn?`, and ${f1(pr.vs)} in his last ${pr.vn} vs ${opp} (${Math.round(15*Math.min(pr.vn,3)/3)}%)`:` — no recent games vs ${opp}, so that part isn't used`}.`);
  if(Math.abs(pr.pf-1)>0.005)why.push(`Pace: this game projects at ${f1(gameProj(g).pace)} possessions vs ${p.team}'s usual ${f1(T[p.team].pace)}, so ${pr.pf>1?'slightly more':'slightly fewer'} chances (×${pr.pf.toFixed(3)}).`);
  if(pr.of!==1)why.push(`Defense: ${opp}'s defensive rating is ${f1(T[opp].drtg)} (rank ${T[opp].drk} of 30, league avg ${f1(LG.d)}), so scoring is ${pr.of>1?'nudged up':'nudged down'} (×${pr.of.toFixed(3)}).`);
  if(pr.bst>1.005)why.push(`Injuries: ${adj.outs.map(x=>esc(x.name)).join(', ')} ${adj.outs.length>1?'are':'is'} out for ${p.team}, so his share goes up (×${pr.bst.toFixed(3)}).`);
  why.push(`Spread: ${S.dist==='p'?`counts like this are modelled with a Poisson curve around ${f1(pr.proj)}`:`his game-to-game swing this season is about ±${f1(pr.sd)}, so the result is modelled as a bell curve around ${f1(pr.proj)}`}, which puts ${side.toLowerCase()} ${ln} at ${Math.round((CALC.side==='over'?pm:1-pm)*100)}%.`);
  why.push(`Reality check: that is blended (75/25) with how often he has actually gone ${side.toLowerCase()} ${ln} this season (${hitS(p.log)}), giving <b>${Math.round(pw*100)}% for ${side.toLowerCase()} ${ln}</b>.`);
  const flags=[];
  if(st==='q')flags.push(`⚠️ He's listed <b>day-to-day</b> on ESPN. The projection assumes he plays normal minutes — if he's limited or sits, this number doesn't apply.`);
  if(Math.abs(minL-minS)>=3)flags.push(`Minutes are ${minL>minS?'up':'down'} lately: ${f1(minL)} a game in his last ${l10.length} vs ${f1(minS)} for the season.`);
  if(fm.t==='Hot'||fm.t==='Cold')flags.push(`Recent form: <b>${fm.t.toLowerCase()}</b> (last 5 games ${fm.t==='Hot'?'above':'below'} his usual level).`);
  if(p.gp<6)flags.push(`Small sample: only ${p.gp} games this season, so treat this with extra caution.`);
  if(Math.abs(pw-0.5)<0.06)flags.push(`This is close to a coin flip, so small changes (minutes, foul trouble) swing it either way.`);
  let book='';const od=parseFloat(CALC.odds);
  if(isFinite(od)&&od>1){const imp=1/od,diff=pw-imp;book=`<div class="card" style="margin:12px 0 0;background:${diff>0.03?'#f0fdf4':diff<-0.03?'#fef2f2':'#f8fafc'}"><b>Compared with odds of ${od.toFixed(2)}:</b> those odds imply ${Math.round(imp*100)}%. The model says ${Math.round(pw*100)}% — ${Math.abs(diff)<0.03?'about the same':diff>0?`${Math.round(diff*100)} points <b>higher</b>, so by this model the odds look longer than the stats suggest`:`${Math.round(-diff*100)} points <b>lower</b>, so by this model the odds look shorter than the stats suggest`}. Bookmaker odds also include their margin and information this model doesn't have (late injury news, minutes plans).</div>`}
  return`<div class="row" style="gap:12px;margin-bottom:12px">
    <div class="kpi" style="flex:1;min-width:150px;border-top-color:var(--accent)"><div class="l">${side} ${ln} ${S.l.toLowerCase()}</div><div class="v">${Math.round(pw*100)}%</div><div class="s">fair odds <b>${fair(pw)}</b></div></div>
    <div class="kpi" style="flex:1;min-width:150px"><div class="l">${CALC.side==='over'?'Under':'Over'} ${ln}</div><div class="v">${Math.round((1-pw)*100)}%</div><div class="s">fair odds ${fair(1-pw)}</div></div>
    <div class="kpi" style="flex:1;min-width:150px"><div class="l">Projection</div><div class="v">${f1(pr.proj)}</div><div class="s">${esc(p.name)} ${stBadge(st)}</div></div></div>
   <div class="grid2"><div><h3>Reasoning</h3><ol style="margin:0;padding-left:18px;line-height:1.55">${why.map(w=>`<li>${w}</li>`).join('')}</ol>
     ${flags.length?`<h3 style="margin-top:14px">Things to watch</h3><ul style="margin:0;padding-left:18px;line-height:1.55">${flags.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>
    <div><h3>How often it actually happened (${side.toLowerCase()} ${ln})</h3><table><tbody>
      <tr><td class="l">This season</td><td class="num">${hitS(p.log)}</td></tr><tr><td class="l">Last ${l10.length}</td><td class="num">${hitS(l10)}</td></tr><tr><td class="l">Last ${vr.length||3} vs ${opp}</td><td class="num">${hitS(vr)}</td></tr></tbody></table>
     <h3 style="margin-top:14px">Last ${l10.length} games</h3><div class="row" style="gap:6px">${l10.map((r,i)=>{const v=vals[i],hit=CALC.side==='over'?v>ln:v<ln;return`<span title="${gDate(r.d)} ${r.home?'vs':'@'} ${r.opp}" class="chip ${hit?'up':'down'}" style="font-size:13px">${v} <span style="font-weight:500;opacity:.7">${r.opp}</span></span>`}).join('')}</div>
     <p class="note">Newest first. Green = the ${side.toLowerCase()} would have won.</p></div></div>${book}
   <p class="note" style="margin-top:10px">Fair odds = 1 ÷ chance, with no bookmaker margin. These are rough statistical estimates from past games, not a prediction.</p>`;
}
function wireCalc(){
  const pl=$('#c_pl');if(!pl)return;
  const upd=()=>{const o=$('#c_out');if(o)o.innerHTML=calcOut()};
  pl.oninput=()=>{const v=pl.value.trim().toLowerCase();const m=PL.find(p=>`${p.name} (${p.team})`.toLowerCase()===v)||PL.filter(p=>p.name.toLowerCase()===v.replace(/\s*\(.*$/,'')).sort((a,b)=>b.gp-a.gp)[0];if(m){CALC.pid=m.id;if(!CALC.line)CALC.line=(Math.floor(sv(m.avg,CALC.k))+0.5).toFixed(1);const li=$('#c_line');if(li)li.value=CALC.line;upd()}};
  $('#c_k').onchange=e=>{CALC.k=e.target.value;if(CALC.pid!=null){CALC.line=(Math.floor(sv(PL[CALC.pid].avg,CALC.k))+0.5).toFixed(1);$('#c_line').value=CALC.line}upd()};
  $('#c_side').onchange=e=>{CALC.side=e.target.value;upd()};
  $('#c_line').oninput=e=>{CALC.line=e.target.value;upd()};
  $('#c_odds').oninput=e=>{CALC.odds=e.target.value;upd()};
}
function vProj(id){
  const up=SCHED.filter(g=>g.t>NOW-3*3600e3);if(!up.length)return`<h2>Projections</h2><div class="empty">No upcoming games in the loaded schedule.</div>`;
  const g=up.find(x=>x.id===id)||up[0],gp=gameProj(g),k=PJ.stat,S=PSTATS[k];
  const players=[g.a,g.h].flatMap(t=>PL.filter(p=>p.team===t&&p.avg.min>=10&&active(p)&&stOf(p,g)!=='out').sort((x,y)=>y.avg.min-x.avg.min)).map(p=>({p,pr:pproj(p,g,k)}));
  const out=[g.a,g.h].flatMap(t=>PL.filter(p=>p.team===t&&p.avg.min>=15&&!active(p)&&stOf(p,g)!=='out'));
  const sel=players.find(x=>x.p.id===PJ.pl);
  const tbl=t=>`<div class="card tw"><h3>${esc(full(t))}</h3><table><thead><tr><th>Player</th><th>Proj MIN</th><th>Proj ${k.toUpperCase()}</th><th>Season</th><th>Last 3</th>${S.lines.map(l=>`<th>Over ${l}</th>`).join('')}</tr></thead><tbody>
   ${players.filter(x=>x.p.team===t).map(({p,pr})=>`<tr class="click ${PJ.pl===p.id?'sel':''}" data-pjp="${p.id}"><td><b>${esc(p.name)}</b> ${stBadge(stOf(p,g))}${pr.bst>1.005?` <span class="chip up" title="Boosted for missing teammates">+${Math.round((pr.bst-1)*100)}%</span>`:''}</td><td class="num">${f1(pr.min)}</td><td class="num"><b style="font-size:15px">${f1(pr.proj)}</b></td><td class="num">${f1(pr.sea)}</td>${(()=>{const r3=p.log.slice(0,3),v=r3.map(r=>sv(r,k)),a=v.reduce((x,y)=>x+y,0)/v.length;return`<td class="num" title="${r3.map((r,i)=>gDate(r.d).replace(/, \d{4}/,"")+" "+(r.home?"vs":"@")+" "+r.opp+": "+v[i]).join(" · ")}">${f1(a)} ${dchip(a-pr.sea,true,Math.max(0.3,pr.sea*0.1))}<div class="note">${v.join(" · ")}</div></td>`})()}${S.lines.map(l=>pcell(pFinal(p,pr,k,l))).join('')}</tr>`).join('')}</tbody></table></div>`;
  let det='';
  if(sel){const {p,pr}=sel,ln=PJ.line[p.id+k]??(Math.floor(pr.proj)+0.5),po=pOver(pr,k,ln);
    det=`<div class="card" id="pjdet"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(p.name)} · ${S.l} vs ${pr.opp}</h3><a class="link" data-nav="#player-${p.id}" data-vs="${pr.opp}">Open player page →</a></div>
     <div class="grid2" style="margin-top:12px"><div><table><tbody>
      <tr><td class="l">Season average</td><td class="num">${f1(pr.sea)}</td><td class="note l">weight 50%</td></tr>
      <tr><td class="l">Last ${p.l10.length} average</td><td class="num">${f1(pr.l10)}</td><td class="note l">weight 35%</td></tr>
      <tr><td class="l">Last ${pr.vn||3} vs ${pr.opp}</td><td class="num">${pr.vs==null?'—':f1(pr.vs)}</td><td class="note l">${pr.vn?'weight '+Math.round(15*Math.min(pr.vn,3)/3)+'%':'no games, not used'}</td></tr>
      <tr><td class="l">Pace adjustment</td><td class="num">×${pr.pf.toFixed(3)}</td><td class="note l">game pace ${f1(gp.pace)} vs ${p.team} ${f1(T[p.team].pace)}</td></tr>
      <tr><td class="l">Opponent defense</td><td class="num">×${pr.of.toFixed(3)}</td><td class="note l">${pr.of===1?'not applied to this stat':`${pr.opp} def rtg ${f1(T[pr.opp].drtg)} vs league ${f1(LG.d)}`}</td></tr>
      <tr><td class="l">Injury boost</td><td class="num">×${pr.bst.toFixed(3)}</td><td class="note l">${pr.bst>1?'teammates out: '+teamAdj(p.team,g).outs.map(x=>esc(x.name)).join(', '):'no teammates out'}</td></tr>
      <tr class="avg"><td class="l">Projection</td><td class="num">${f1(pr.proj)}</td><td class="note l">${S.dist==='p'?'Poisson model':'normal model, spread ±'+f1(pr.sd)}</td></tr></tbody></table></div>
     <div><div class="row"><label style="font-weight:700">Line</label><input id="pjline" type="number" step="0.5" value="${ln}" data-pjk="${p.id+k}" style="width:90px"></div>
      <div id="pjres">${lineRes(p,pr,k,ln)}</div></div></div></div>`}
  return`<h2>Projections</h2><p class="sub">Model estimates for upcoming games, built from the stats in this app. Fair odds = 1 ÷ probability (decimal), with no bookmaker margin.</p>
  ${calcCard()}
  <div class="card"><div class="row">${up.slice(0,30).map(x=>`<button data-nav="#proj-${x.id}" class="pill${x===g?' on':''}">${x.a} @ ${x.h} · ${x.t.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</button>`).join('')}</div></div>
  <div class="card board"><div class="mh"><div class="side${gp.ap>gp.hp?' lead':''}"><div class="nm">${tlink(g.a)}</div><div class="score">${Math.round(gp.ap)}</div><div class="rec">Win ${Math.round(gp.pa*100)}% · fair ${fair(gp.pa)}</div></div><div class="vsbox">@<div class="note" style="font-weight:600">${glabel(g)}</div></div><div class="side${gp.hp>gp.ap?' lead':''}"><div class="nm">${tlink(g.h)}</div><div class="score">${Math.round(gp.hp)}</div><div class="rec">Win ${Math.round(gp.ph*100)}% · fair ${fair(gp.ph)}</div></div></div>
   <p class="note" style="text-align:center;margin:10px 0 0">Projected total ${f1(gp.total)} · spread ${g.h} ${gp.margin>=0?'-':'+'}${f1(Math.abs(gp.margin))} · pace ${f1(gp.pace)}. Built from both teams' ratings and pace, with 1.4 pts of home advantage each way.</p></div>
  <div class="card"><div class="row">${Object.entries(PSTATS).filter(([kk,v])=>!v.hide).map(([kk,v])=>`<button data-pjs="${kk}" style="font:inherit;font-weight:700;padding:7px 12px;border-radius:8px;cursor:pointer;border:1px solid ${kk===k?'#e35a12':'var(--line)'};background:${kk===k?'#e35a12':'#fff'};color:${kk===k?'#fff':'inherit'}">${v.l}</button>`).join('')}</div>
   <p class="note" style="margin:10px 0 0">Each cell: chance of going <b>over</b> the line, and the fair decimal odds beneath. Click a player to see how the number was built and to test your own line.</p></div>
  ${(()=>{const c=[g.a,g.h].map(t=>impactCard(t,g)).join('');return c?`<div class="grid2">${c}</div>`:''})()}
  ${det}<div class="grid2">${tbl(g.a)}${tbl(g.h)}</div>
  ${(()=>{const q=[g.a,g.h].flatMap(t=>PL.filter(p=>p.team===t&&stOf(p,g)==='q'));return q.length?`<div class="card note"><b>Questionable (Q):</b> ${q.map(p=>esc(p.name)).join(', ')}: listed day-to-day or due back on game day. Their projections assume they play.</div>`:''})()}
  ${out.length?`<div class="card note">Left out because they haven't played in their team's last 3 games (likely injured or out of the rotation): ${out.map(p=>esc(p.name)).join(', ')}.</div>`:''}
  <div class="card note"><b>How to read this.</b> Each projection weights season average 50%, last 10 games 35% and the last 3 meetings with this opponent up to 15%. Each chance is 75% from the model's curve and 25% from how often the player has actually cleared that line this season. It then adjusts for the expected pace of the game, and for points and 3-pointers, the opponent's defensive rating. Players listed Out on ESPN's injury report are removed, and their teammates' numbers and the team's ratings are adjusted, so the projection already takes the absences into account. It can't see rest days, minutes limits or late lineup changes. It also hasn't been tested against past results, so treat the percentages as rough estimates, not a forecast.</div>`;
}
function lineRes(p,pr,k,ln){const po=pFinal(p,pr,k,ln),vr=p.vs[pr.opp]||[];
  const hr=(lab,rows)=>`<tr><td class="l">${lab}</td><td class="num">${rows.length?Math.round(hit(rows,k,ln)*100)+'%':'—'}</td><td class="note">${rows.length?rows.filter(r=>sv(r,k)>ln).length+' of '+rows.length:''}</td></tr>`;
  return`<div class="row" style="margin:12px 0"><div class="kpi" style="flex:1"><div class="l">Over ${ln}</div><div class="v">${Math.round(po*100)}%</div><div class="s">fair odds ${fair(po)}</div></div><div class="kpi" style="flex:1"><div class="l">Under ${ln}</div><div class="v">${Math.round((1-po)*100)}%</div><div class="s">fair odds ${fair(1-po)}</div></div></div>
  <table><thead><tr><th class="l">Actually went over ${ln}</th><th>Rate</th><th></th></tr></thead><tbody>${hr('This season',p.log)}${hr('Last '+p.l10.length,p.l10)}${hr('Last '+(vr.length||3)+' vs '+pr.opp,vr)}</tbody></table>
  <p class="note">If a bookmaker's odds for the over are <b>higher</b> than ${fair(po)}, they imply a lower chance than this model gives.</p>`}

document.addEventListener('click',e=>{

  if(s){const p=+s.dataset.selp,i=+s.dataset.seli;sel[p]=sel[p]===i?undefined:i;const y=scrollY;render();scrollTo(0,y);return}
  const a=e.target.closest('[data-nav]');
  if(a){e.preventDefault();e.stopPropagation();const h=a.dataset.nav;const m=h.match(/^#player-(\d+)$/);if(m&&a.dataset.vs)vsSel[+m[1]]=a.dataset.vs;if(location.hash===h)render();else location.hash=h;scrollTo(0,0)}
});
addEventListener('hashchange',render);
render();
</script>
